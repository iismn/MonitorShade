name: macOS

on:
  push:
    branches: [mac, codex/mac-build]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    branches: [mac]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app, verify signature and run self-tests
        run: |
          mkdir -p dist
          zsh macos/build.command "$PWD/dist/Monitor Shade.app" 2>&1 | tee dist/build.txt
          file "dist/Monitor Shade.app/Contents/MacOS/MonitorShade"
          xcrun lipo "dist/Monitor Shade.app/Contents/MacOS/MonitorShade" -verify_arch arm64 x86_64
          plutil -lint "dist/Monitor Shade.app/Contents/Info.plist"
      - name: Render settings pages with preview monitors
        run: |
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
          "dist/Monitor Shade.app/Contents/MacOS/MonitorShade" --ui-test "$PWD/dist/ui"
          cat dist/ui/ui.txt
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Monitor Shade.app" dist/MonitorShade-macOS.zip
          cd dist
          shasum -a 256 MonitorShade-macOS.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonitorShade-macOS
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-macos27:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MonitorShade-macOS
          path: dist
      - name: Run the packaged app on macOS 27
        run: |
          sw_vers
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
          ditto -x -k dist/MonitorShade-macOS.zip app
          "app/Monitor Shade.app/Contents/MacOS/MonitorShade" --self-test
          "app/Monitor Shade.app/Contents/MacOS/MonitorShade" --ui-test "$PWD/ui-macos27"
          cat ui-macos27/ui.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonitorShade-macOS27-ui
          path: ui-macos27/
          if-no-files-found: error
          retention-days: 14
